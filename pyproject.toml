[project]
name = "tiny-lm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tatsuya Shimomoto", email = "shimo4228@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mlx>=0.31.2",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/tiny_lm"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
